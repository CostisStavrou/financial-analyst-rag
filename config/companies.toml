# Corpus: 10 companies x 3 fiscal years of 10-K filings.
#
# Picked to overlap with the FinanceBench open-source sample (150 questions, 112 on 10-Ks):
# for each company the 3 fiscal years with the most 10-K questions, then the top 10 companies
# (CVS Health instead of Corning, tied on 4, for a Health Care name). Where a company has
# questions in fewer than 3 years, the nearest earlier year fills the gap.
# Covers 57 of the 112 FinanceBench 10-K questions. Re-check with `finrag financebench`.
#
# `fiscal_years` use the company's own label (FinanceBench `doc_period`), e.g. Best Buy
# fiscal 2023 ended 28 Jan 2023.

